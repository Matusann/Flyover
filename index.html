<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.15.0/dist/maplibre-gl.css" />
    <title>Document</title>
</head>
<body>
    


<div id="map"></div>
<script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.15.0/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
        container: 'map', // container id
        style: 'https://demotiles.maplibre.org/globe.json', // style URL
        center: [0, 0], // starting position [lng, lat]
        zoom: 2 // starting zoom
    });

    const resposta = await fetch('Pedalada_matinal.gpx');
    const texto = await resposta.text();
    console.log(texto);

    const parser = new DOMParser();
    const xml =  parser.parseFromString(texto, "text/xml");

    xml.querySelectorAll("trkpt").forEach((trkpt) => {
        const lat = trkpt.getAttribute("lat");
        const lon = trkpt.getAttribute("lon");
        console.log(lat, lon);
    }); 
</script>
</body>
</html>
